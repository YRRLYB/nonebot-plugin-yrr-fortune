[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-yrr-fortune"
version = "1.0.4"
description = "NoneBot 每日运势卡片：七档运势、六维雷达、幸运信息、宜忌与六套模板"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "YRR" }]
keywords = ["nonebot", "nonebot2", "plugin", "fortune", "运势", "onebot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "nonebot-plugin-htmlrender>=0.6.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.24.0",
    "pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/YRRLYB/nonebot-plugin-yrr-fortune"
Repository = "https://github.com/YRRLYB/nonebot-plugin-yrr-fortune"
Issues = "https://github.com/YRRLYB/nonebot-plugin-yrr-fortune/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nonebot_plugin_yrr_fortune*"]

[tool.setuptools.package-data]
nonebot_plugin_yrr_fortune = [
    "help.jpg",
    "preview-*.jpg",
    "templates/*.html",
]
