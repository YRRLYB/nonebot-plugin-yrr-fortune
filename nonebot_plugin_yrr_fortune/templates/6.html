<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>运势</title><style>:root{{--theme-color:{theme_color};--font-display:'Mochiy Pop One',sans-serif;--font-body:'MsyhCustom','DotGothic16',sans-serif;}}{font_face_rule}html,body{{margin:0;padding:0;width:1080px;height:1920px;}}body{{font-family:var(--font-body);background-image:url({background_image});background-size:cover;background-position:center;filter:grayscale(30%) contrast(110%);position:relative;}}.container{{width:100%;height:100%;position:relative;}}.narrator-box{{position:absolute;top:40px;right:40px;background:#fff;border:3px solid #000;padding:15px 20px;text-align:right;box-shadow:5px 5px 0 #000;}}.narrator-box .title{{font-size:24px;font-weight:bold;margin-bottom:5px;}}.narrator-box .date{{font-size:16px;}}.user-info{{position:absolute;top:40px;left:40px;display:flex;align-items:center;background:#fff;border:3px solid #000;padding:10px;box-shadow:-5px 5px 0 #000;}}.user-avatar{{width:50px;height:50px;content:url({avatar_url});border:2px solid #000;margin-right:10px;}}.user-id{{color:#000;}}.fortune-effect{{position:absolute;top:150px;right:80px;transform:rotate(10deg);text-align:center;}}.level-text{{font-family:var(--font-display),'MsyhCustom';font-size:100px;color:var(--theme-color);-webkit-text-stroke:4px #000;text-shadow:6px 6px 0 #fff;line-height:1;}}.stars-text{{font-size:24px;color:#000;font-weight:bold;background:#fff;padding:2px 10px;border:2px solid #000;display:inline-block;margin-top:10px;}}.speech-bubble{{position:absolute;bottom:350px;left:50px;width:400px;background:#fff;border:3px solid #000;border-radius:20px;padding:25px;box-shadow:5px 5px 0 #000;}}.speech-bubble::after{{content:'';position:absolute;bottom:-20px;left:60px;width:30px;height:30px;background:#fff;border-bottom:3px solid #000;border-right:3px solid #000;transform:rotate(45deg);}}.quote-text{{font-size:20px;line-height:1.6;color:#000;}}.details-panel{{position:absolute;bottom:40px;right:40px;width:550px;background:#fff;border:3px solid #000;box-shadow:-5px -5px 0 #000;padding:20px;}}.panel-title{{font-size:18px;font-weight:bold;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:15px;color:#000;}}.panel-body{{display:grid;grid-template-columns:250px 1fr;gap:20px;}}.radar-container svg text{{font-family:var(--font-body);fill:#000;font-size:14px;font-weight:bold;}}.radar-container svg path{{filter:none;}}.radar-container svg circle{{stroke-width:2 !important;}}.stats-list{{display:flex;flex-direction:column;gap:15px;}}.stat-item{{font-size:18px;color:#000;}}.stat-label{{font-weight:bold;}}.stat-value{{color:#fff;background-color:var(--theme-color);padding:2px 8px;border:2px solid #000;}}.stat-value.good{{background-color:#26de81;}}.stat-value.bad{{background-color:#ff4757;}}.yrr-watermark{{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99999;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);font:600 18px/1.4 'MsyhCustom','Noto Sans SC',sans-serif;letter-spacing:1px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.45);}}</style></head><body><div class="container"><div class="narrator-box"><div class="title">今日運勢</div><div class="date">{current_date}</div></div><div class="user-info"><img class="user-avatar" alt="用户头像"/><div class="user-id">ID: {qq_number}</div></div><div class="fortune-effect"><div class="level-text">{level}</div><div class="stars-text">{stars}</div></div><div class="speech-bubble"><p class="quote-text">“{fortune_text}”</p></div><div class="details-panel"><div class="panel-title">运势参数 / PARAMETERS</div><div class="panel-body"><div class="radar-container">{radar_svg}</div><div class="stats-list"><div class="stat-item"><span class="stat-label">幸运色: </span><span class="stat-value">{lucky_color}</span></div><div class="stat-item"><span class="stat-label">数字: </span><span class="stat-value">{lucky_number}</span></div><div class="stat-item"><span class="stat-label">方位: </span><span class="stat-value">{lucky_direction}</span></div><div class="stat-item"><span class="stat-label">宜: </span><span class="stat-value good">{good_activities}</span></div><div class="stat-item"><span class="stat-label">忌: </span><span class="stat-value bad">{bad_activities}</span></div></div></div></div></div><div class="yrr-watermark">プリン bot</div></body></html>
