<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>运势</title><style>:root{{--theme-color:{theme_color};--font-display:'Teko',sans-serif;--font-body:'MsyhCustom','Noto Sans SC',sans-serif;}}{font_face_rule}html,body{{margin:0;padding:0;width:1080px;height:1920px;}}body{{font-family:var(--font-body);background-image:url({background_image});background-size:cover;background-position:center;color:#fff;position:relative;}}.header{{position:absolute;top:40px;right:40px;text-align:right;}}.title{{font-size:32px;font-weight:700;letter-spacing:5px;text-shadow:0 2px 4px rgba(0,0,0,0.5);border-bottom:2px solid var(--theme-color);padding-bottom:5px;}}.date{{font-size:16px;margin-top:5px;letter-spacing:2px;opacity:0.8;}}.fortune-title{{position:absolute;top:50%;right:40px;transform:translateY(-50%);font-family:var(--font-display),'MsyhCustom';font-size:220px;line-height:1;font-weight:700;color:#fff;writing-mode:vertical-rl;text-orientation:upright;text-shadow:0 0 15px var(--theme-color),0 0 30px var(--theme-color),0 5px 10px rgba(0,0,0,0.5);}}.stats-panel{{position:absolute;bottom:0;left:0;right:0;height:300px;background:linear-gradient(to top,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0.85) 60%,transparent 100%);padding:40px;display:flex;align-items:flex-end;gap:40px;}}.left-stats{{flex-grow:1;}}.quote{{font-size:20px;line-height:1.7;font-weight:500;margin-bottom:25px;border-left:4px solid var(--theme-color);padding-left:20px;max-width:500px;}}.details-grid{{display:flex;gap:30px;}}.detail-item .label{{font-size:14px;color:rgba(255,255,255,0.6);letter-spacing:2px;}}.detail-item .value{{font-size:28px;font-weight:700;}}.right-radar{{width:260px;flex-shrink:0;text-align:center;}}.radar-title{{font-weight:700;letter-spacing:3px;margin-bottom:10px;}}.radar-container svg text{{fill:#fff;font-weight:500;}}.user-badge{{position:absolute;bottom:280px;left:40px;display:flex;align-items:center;gap:15px;background:rgba(0,0,0,0.5);padding:10px;border-radius:50px;border:1px solid rgba(255,255,255,0.2);}}.user-avatar{{width:50px;height:50px;border-radius:50%;content:url({avatar_url});}}.user-name{{font-size:18px;font-weight:700;color:#fff;}}.yrr-watermark{{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99999;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.9);font:600 18px/1.4 'MsyhCustom','Noto Sans SC',sans-serif;letter-spacing:1px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.45);}}</style></head><body><header class="header"><div class="title">FORTUNE</div><div class="date">{current_date}</div></header><div class="fortune-title">{level}</div><div class="user-badge"><img class="user-avatar" alt="avatar"/><div class="user-name">USER {qq_number}</div></div><div class="stats-panel"><div class="left-stats"><p class="quote">“{fortune_text}”</p><div class="details-grid"><div class="detail-item"><div class="label">LUCKY COLOR</div><div class="value">{lucky_color}</div></div><div class="detail-item"><div class="label">LUCKY NUM</div><div class="value">{lucky_number}</div></div><div class="detail-item"><div class="label">STARS</div><div class="value">{stars}</div></div></div></div><div class="right-radar"><div class="radar-title">ABILITY</div><div class="radar-container">{radar_svg}</div></div></div><div class="yrr-watermark">プリン bot</div></body></html>
